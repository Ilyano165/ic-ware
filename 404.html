<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — IC Ware</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060708">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23060708"/><rect x="4" y="5" width="6" height="22" rx="1" fill="%23F4F6F5"/><path d="M28 5 H14 V27 H28 V21 H20 V11 H28 Z" fill="%2319E56E"/></svg>'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 460px at 50% -8%, rgba(25,229,110,.1), transparent 60%), #060708;
  color:#F4F6F5;
  font-family:"Inter Tight", system-ui, sans-serif;
  text-align:center;padding:2rem;
  -webkit-font-smoothing:antialiased;
}
.n{
  font-size:clamp(6rem,22vw,12rem);font-weight:700;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(115deg,#19E56E,#8CF7B9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:600;letter-spacing:-.02em;margin-top:1rem}
p{color:#8E979B;margin-top:.7rem;font-family:"Inter", system-ui, sans-serif}
a{
  display:inline-block;margin-top:2rem;
  font-weight:600;font-size:.95rem;letter-spacing:-.01em;text-decoration:none;
  padding:.9em 1.7em;border-radius:999px;
  background:#19E56E;color:#04120A;
  box-shadow:0 10px 34px -8px rgba(25,229,110,.35);
  transition:filter .2s ease, transform .2s ease;
}
a:hover{filter:brightness(1.07)}
a:active{transform:scale(.97)}
</style>
</head>
<body>
<div>
  <div class="n">404</div>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht haben wir sie noch nicht gebaut.</p>
  <a href="/" id="home">Zur Startseite</a>
</div>
<script>
(function(){
  var h = window.location.hostname, p = window.location.pathname.split("/").filter(Boolean);
  if(/\.github\.io$/.test(h) && p.length > 0){
    document.getElementById("home").setAttribute("href", "/" + p[0] + "/");
  }
})();
</script>
</body>
</html>
